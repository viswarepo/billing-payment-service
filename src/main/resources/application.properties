server.port=9099

spring.application.name=billing-payment-service

# ---------------------------------------------------------------------------
# Database (PostgreSQL)
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:postgresql://localhost:5432/billing_db
spring.datasource.username=bill_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ---------------------------------------------------------------------------
# Razorpay
# ---------------------------------------------------------------------------

# Get these from https://dashboard.razorpay.com/#/app/keys - use TEST mode
# keys (rzp_test_...) until you're ready to go live.
razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_Td71kiTsXmsmNN}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:yDRYTYB4MAnuvvEfND9f5VlE}

# Set under Settings > Webhooks in the Razorpay dashboard when you register
# this service's /api/v1/webhooks/razorpay endpoint.
razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:changeme}

# ---------------------------------------------------------------------------
# Billing
# ---------------------------------------------------------------------------

# Cron for the automatic recurring billing cycle job. Default: 2 AM daily.
billing.cycle-cron=0 0 2 * * *

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------

management.endpoints.web.exposure.include=health,info

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------

logging.level.com.sms.billing=INFO
logging.level.org.hibernate.SQL=WARN

spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.properties.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id: billing-payment-service
spring.kafka.consumer.auto-offset-reset: latest
